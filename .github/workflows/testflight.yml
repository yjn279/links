name: TestFlight

# PR を作成・更新すると、その時点のコードをブランチプレビューとして TestFlight に配信する。
# main への push は同じ仕組みでリリースビルドを配信する。
# 実ビルドと submit は EAS のサーバ側で実行されるため ( --no-wait ) 、
# GitHub Actions はビルドをキューに積むだけで完了する。進捗は EAS と TestFlight 側で追う。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build & submit to TestFlight
    runs-on: ubuntu-latest
    # draft PR ではビルドしない ( EAS のビルド枠を無駄にしないため )
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # PR タイトルは攻撃者が制御できる入力なので、シェルにも GITHUB_OUTPUT にも
      # 直接展開しない。env 経由で受け取り、改行を除去した 1 行を heredoc で書き出す。
      - name: Compose build message
        id: msg
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            raw="PR #${PR_NUMBER} · ${HEAD_REF} · ${PR_TITLE}"
          else
            raw="${REF_NAME} · ${SHA}"
          fi
          # 改行 ( CR/LF ) を空白へ畳み込み、output injection を防ぐ
          message=$(printf '%s' "$raw" | tr '\r\n' '  ')
          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # message はシェルに直接展開せず env 経由で渡し、変数参照する ( injection 防止 )
      - name: Build & auto-submit to TestFlight
        env:
          MSG: ${{ steps.msg.outputs.message }}
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --no-wait \
            --auto-submit \
            --message "$MSG"
