name: TestFlight

# PR を作成・更新すると、その時点のコードをブランチプレビューとして TestFlight に配信する。
# main への push は同じ仕組みでリリースビルドを配信する。
# 実ビルドと submit は EAS のサーバ側で実行されるため ( --no-wait ) 、
# GitHub Actions はビルドをキューに積むだけで完了する。進捗は EAS と TestFlight 側で追う。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build & submit to TestFlight
    runs-on: ubuntu-latest
    # draft PR ではビルドしない ( EAS のビルド枠を無駄にしないため )
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # PR タイトルなどをそのままシェルに展開すると injection になり得るため env 経由で安全に渡す
      - name: Compose build message
        id: msg
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            printf 'message=PR #%s · %s · %s\n' "$PR_NUMBER" "$HEAD_REF" "$PR_TITLE" >> "$GITHUB_OUTPUT"
          else
            printf 'message=%s · %s\n' "$REF_NAME" "$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & auto-submit to TestFlight
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --no-wait \
            --auto-submit \
            --message "${{ steps.msg.outputs.message }}"
