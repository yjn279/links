name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Expo app — typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx expo lint

      - name: Expo doctor
        run: npx expo-doctor

  backend:
    name: Backend — typecheck & vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Run vitest
        run: npm test
