name: links
description: "A minimalist personal iOS bookmarking app with AI summary and tags."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  html: ^0.15.4
  go_router: ^14.2.0
  share_handler: ^0.0.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
